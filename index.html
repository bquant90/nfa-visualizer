<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>NFA Visualizer</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <h1>NFA Visualizer</h1>
        <p class="intro">Describe a machine below, then click <strong>Load machine</strong>.</p>

        <!-- 1. Where the user describes the machine -->
        <section>
            <h2>1. Describe your machine</h2>
            <textarea id="source" spellcheck="false"># Accepts strings of 0s and 1s that end in "01"
                alphabet: 0, 1
                states: q0, q1, q2
                start: q0
                accepting: q2

                rule: q0 -- 0 --> q0
                rule: q0 -- 1 --> q0
                rule: q0 -- 0 --> q1
                rule: q1 -- 1 --> q2

                test: 101
                test: 0110
                test:
                test: 1201
            </textarea>
            <div class="actions">
                <button id="load" type="button">Load machine</button>
                <button id="choose-file" type="button" class="secondary">Open a .txt file…</button>
                <!-- The browser's built-in file picker. Hidden; the button above opens it. -->
                <input id="file-input" type="file" accept=".txt,text/plain" hidden>
                <span id="file-name" class="file-name"></span>
            </div>
        </section>

        <!-- 2. What the page found: a summary, or a list of problems -->
        <section>
            <h2>2. What we found</h2>
            <div id="status" class="status">Nothing loaded yet.</div>
        </section>

        <!-- 3. Where the user picks a string and runs it -->
        <section>
            <h2>3. Test a string</h2>
            <div class="actions">
                <input id="test-string" type="text" placeholder="Type a string, e.g. 1101" spellcheck="false" autocomplete="off">
                <button id="run" type="button">Run</button>
            </div>
            <!-- Buttons for the test strings found in the machine description -->
            <div id="test-chips" class="chips"></div>
            <div id="verdict" class="status" hidden></div>
            <div id="steps"></div>
        </section>

        <!-- 4. The drawing. -->
        <section>
            <h2>3. The machine</h2>
            <div id="machine">
                <p class="placeholder">The drawing will appear here in Phase 3.</p>
            </div>
        </section>

        <!-- Order matters: each file can only use the files loaded above it. -->
         <script src="lib/cytoscape.min.js"></script>
         <script src="js/parser.js"></script>
         <script src="js/engine.js"></script>
         <script src="js/display.js"></script>
         <script src="js/app.js"></script>
    </body>
</html>
